<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Producto</title>
</head>

<body>

<header>

    <div class="logoclaro">
        <a href="./index.html">
            <img src="./img/logo-claro.png" alt="logo">
        </a>
    </div>

    <nav class="userheader">
        <ul class="navul">
        <li><a href="./index.html">Home </a></li>
        <li id="li-login"><a href="./login.html">Login </a></li>
        <li id="li-registro"><a href="./register.html">Register</a></li>
        </ul>
    </nav>

    <form class="buscador" action="./search-results.html" method="GET">
        <input type="text" name="buscar" placeholder="Encontrá tus próximos botines">
        <button type="submit">Buscar</button>
    </form>

</header>


<div class="contenido">

    <div>
        <aside class="aside">
            <h3>Explora el catalogo</h3>
            <h2>Categorías</h2>

            <nav>
               <ul id="lista-categorias"></ul>
            </nav>
        </aside>
    </div>


<main class="main">

        <div class="homemenshoes">
            <p><a href="./index.html">Home</a> / <a href="./category.html">Categorías</a> / Producto</p>
        </div>

        <p class="menshoe">Detalles del producto</p>

        
<section class="product-details">

    <div class="product-image">
        <img src="" alt="Imagen del producto" id="product-image">
    </div>

    <div class="product-info">
        <p id="product-brand"></p>
        <h1 id="product-title"></h1>
        <p id="product-description"></p>
        <p class="precios" id="product-price"></p>

        <p>
            Categoría:
            <a id="product-category" href="#"></a>
        </p>

        <p id="product-stock"></p>
    </div>

</section>

</main>

</div>


<footer>

    <a href="./index.html">
        <img src="./img/logo-claro.png" alt="logo">
    </a>

    <ul class="footer-links">
        <li>
            <a href="./index.html" class="txtfooter">Primer Toque</a>
        </li>

        <p class="txtfooter">Proyecto integrador TDFE</p>

        <p class="txtfooter">
            Grupo: Lautaro Zayat, Bautista Sterponi y Facundo Ponisio
        </p>
    </ul>

</footer>


<script src="./js/saludo.js"></script>
<script src="./js/logout.js"></script>
<script src="./js/product.js"></script>
</body>
</html>
