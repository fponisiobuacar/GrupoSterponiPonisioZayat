<html lang="en">
<head>

    <title>register</title>
</head>
<body>
    <header>
<div class="logoclaro">
    <a href="./index.html">
        <img src="./img/logo-claro.png" alt="logo">
    </a>
</div>
    <nav class="userheader">
        <ul class="navul">
        <li><a href="./index.html">Home </a></li>
        <li id="li-login"><a href="./login.html">Login </a></li>
        <li id="li-registro"><a href="./register.html">Register</a></li>
        </ul>
    </nav>
<form class="buscador" action="./search-results.html" method="GET">
    <input type="text" name="buscar" placeholder="Encontrá tus próximos botines">
    <button type="submit">Buscar</button>
</form>
</header>

<main class="mainregister">

    <div>
       
    </div>

    <section class="login">
<div class="registerform">
        <p class="tulugar">Sumate al equipo</p>
        <h2> Tu primer toque</h2>
        <p>Crea tu cuenta</p>
    
    <form class="emailregister" action="./login.html" method="GET">
        <div class="campoform">
            <label for="email-register">Email:</label>
            <input id="email-register" type="email" name="email"
                placeholder="email@gmail.com" required>
        </div>

        <div class="campoform">
            <label for="clave-register">Contraseña:</label>
            <input id="clave-register" type="password"
                placeholder="Tu contraseña" required>
        </div>

        <div class="campoform">
            <label for="repetir-clave">Repetí tu contraseña:</label>
            <input id="repetir-clave" type="password"
                placeholder="Repetí tu contraseña" required>
        </div>

        <div class="terminos">
            <input type="checkbox" id="terminos" required>
            <label for="terminos">Acepto los términos y condiciones</label>
        </div>

        <button class="registrarme" type="submit">Registrarme</button>
    </form>

    <a href="./login.html">Ya tengo una cuenta</a>
</div>

 
</section>

</main>




<footer>
    <a href="./index.html">
        <img src="./img/logo-claro.png" alt="logo">
    </a>

 <ul class="footer-links">

</ul>

</footer>
    

<script src="./js/saludo.js"></script>

</body>
</html>
